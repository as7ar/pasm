[workspace]
resolver = "2"
members = ["pasm", "pasm-macros", "examples/hello"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["AS7AR"]
rust-version = "1.85"

[workspace.dependencies]
pasm = { path = "pasm", version = "0.1.0" }
pasm-macros = { path = "pasm-macros", version = "0.1.0" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
